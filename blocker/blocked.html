<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>First things first</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #fbfbf6; color: #1e2318;
    font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-color-scheme: dark) { body { background: #14170f; color: #edf0e4; } }
  .wrap { text-align: center; max-width: 460px; padding: 40px 28px; animation: rise .5s cubic-bezier(.22,.68,0,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .mark { width: 52px; height: 52px; margin-bottom: 22px; color: #6d8340; }
  h1 { font-size: 28px; font-weight: 690; letter-spacing: -.025em; margin: 0 0 10px; }
  p { margin: 0 0 8px; color: #6c7462; font-size: 15px; }
  @media (prefers-color-scheme: dark) { p { color: #99a488; } }
  .count { font-size: 56px; font-weight: 700; letter-spacing: -.04em; color: #6d8340; margin: 18px 0 4px; font-variant-numeric: tabular-nums; }
  @media (prefers-color-scheme: dark) { .count { color: #a6c368; } }
  .btn {
    display: inline-flex; align-items: center; gap: 9px; margin-top: 26px;
    padding: 15px 26px; border-radius: 16px; text-decoration: none;
    font-size: 16px; font-weight: 620; color: #fff;
    background: linear-gradient(168deg, #6d8340, #4e6229);
    box-shadow: 0 6px 20px -9px #4e6229; border: none; cursor: pointer;
    transition: transform .26s cubic-bezier(.34,1.56,.64,1), box-shadow .3s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px -10px #4e6229; }
  .btn:active { transform: scale(.97); }
  .fine { margin-top: 22px; font-size: 12.5px; opacity: .65; }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21V9"/><path d="M12 12c0-3 2.4-5.5 6-6 0 3.6-2.2 6-6 6z"/><path d="M12 16c0-2.4-1.9-4.4-4.8-4.8 0 2.9 1.8 4.8 4.8 4.8z"/>
    </svg>
    <h1>First things first.</h1>
    <p id="sub">Tonight's cards aren't done yet.</p>
    <div class="count" id="count">—</div>
    <p id="unit">cards to go</p>
    <a class="btn" id="go" href="#">Study now</a>
    <p class="fine" id="fine">This page unlocks the moment you hit tonight's target.</p>
  </div>
<script src="blocked.js"></script>
</body>
</html>
